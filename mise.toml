min_version = "2026.09.12"

[tools]
node = "lts"
pnpm = "latest"
hk = "latest"
pkl = "latest"
gitleaks = "latest"
actionlint = "latest"
ghalint = "latest"
pinact = "latest"
zizmor = "latest"

[settings]
lockfile = true
env_shell_expand = false
minimum_release_age = "3d"

[env]
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"
