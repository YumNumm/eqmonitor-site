version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Asia/Tokyo"
      time: "09:00"
    # パッチ更新は1つのPRにまとめ、マイナー・メジャー更新は依存ごとに個別のPRにする
    groups:
      patch:
        update-types:
          - "patch"
    cooldown:
      default-days: 7

  # pnpm のワークスペースは npm として扱われる
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/workers/beta-worker"
      - "/workers/og-worker"
    schedule:
      interval: "daily"
      timezone: "Asia/Tokyo"
      time: "09:00"
    groups:
      patch:
        update-types:
          - "patch"
    cooldown:
      default-days: 7
