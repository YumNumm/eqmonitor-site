version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Asia/Tokyo"
      time: "09:00"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/workers/beta-worker"
      - "/workers/og-worker"
    schedule:
      interval: "daily"
      timezone: "Asia/Tokyo"
      time: "09:00"
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
